<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Waiting Game</title>
    <!-- Modern Typography: Space Grotesk & JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="styles.css">
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent !important;
        /* Improved font rendering for transparent windows */
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      #game-container {
        width: 100vw;
        height: 100vh;
        background: transparent;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        position: relative;
        /* Kinetic entry disabled if issues persist, but kept for now */
        animation: kinetic-entry 0.6s cubic-bezier(0.23, 1, 0.32, 1);
      }
      @keyframes kinetic-entry {
        from { transform: translateY(100px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      canvas {
        background: transparent !important;
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
        image-rendering: pixelated; /* Crisp dino */
      }
      #ui-layer {
        position: absolute;
        top: 40px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        pointer-events: none;
      }
      .score-board {
        /* backdrop-filter removed as it causes ghosting on Linux/NVIDIA/Wayland */
        background: rgba(8, 18, 18, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 12px 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        color: #68BA7F;
        font-family: 'Space Grotesk', sans-serif;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 2px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .score-value {
        font-family: 'JetBrains Mono', monospace;
        font-size: 28px;
        font-weight: 700;
        text-shadow: 0 0 10px rgba(104, 186, 127, 0.5);
      }
      .high-score {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        opacity: 0.7;
        display: flex;
        justify-content: center;
        gap: 6px;
        color: #A0A0A0;
      }
      .high-score span {
        color: #68BA7F;
      }
      #game-over-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 20;
        opacity: 0;
        pointer-events: none;
        background: transparent;
        transition: opacity 0.5s ease;
      }
      #game-over-layer.terminated {
        background: transparent;
        backdrop-filter: none;
      }
      .go-title {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 42px;
        font-weight: 700;
        color: #ff4b2b;
        letter-spacing: 6px;
        margin-bottom: 12px;
        text-shadow: 0 0 20px rgba(255, 75, 43, 0.4);
      }
      .go-subtitle {
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.7);
        letter-spacing: 2px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <div id="ui-layer">
        <div class="score-board">
          <div class="score-value" id="score">00000</div>
          <div class="high-score">HI <span id="highScore">00000</span></div>
        </div>
      </div>
      <div id="game-over-layer">
        <div class="go-title">TERMINATED</div>
        <div class="go-subtitle">
            SPACE TO INITIALIZE<br><br>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <select id="game-select" style="background: rgba(0,0,0,0.5); color: white; border: 1px solid white; padding: 5px; font-family: inherit;">
                    <option value="dino">Dino Runner</option>
                    <option value="flappy">Flappy Bird</option>
                    <option value="gravity">Gravity Runner</option>
                </select>
                <select id="difficulty-select" style="background: rgba(0,0,0,0.5); color: white; border: 1px solid white; padding: 5px; font-family: inherit;">
                    <option value="easy">Easy</option>
                    <option value="normal" selected>Normal</option>
                    <option value="hard">Hard</option>
                </select>
            </div>
            <div style="margin-top: 20px;">
                <button id="leaderboard-btn" style="background: transparent; color: #68BA7F; border: 1px solid #68BA7F; padding: 8px 16px; font-family: inherit; font-weight: bold; cursor: pointer; border-radius: 4px; transition: all 0.2s;">
                    🏆 GLOBAL RANKS
                </button>
            </div>
        </div>
      </div>

      <!-- Player Profile Setup -->
      <div id="profile-layer" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 30; background: rgba(0,0,0,0.9);">
          <div style="background: #111; padding: 30px; border: 1px solid #333; border-radius: 12px; text-align: center; width: 300px;">
              <h2 style="color: #68BA7F; margin-top: 0; font-family: 'Space Grotesk', sans-serif;">PLAYER PROFILE</h2>
              <p style="color: #aaa; font-family: 'JetBrains Mono', monospace; font-size: 12px; margin-bottom: 20px;">Enter your details for the Global Leaderboard</p>
              
              <input type="text" id="profile-username" placeholder="Username" style="width: 100%; box-sizing: border-box; background: #000; border: 1px solid #444; color: white; padding: 10px; margin-bottom: 10px; font-family: 'JetBrains Mono', monospace;">
              <input type="email" id="profile-email" placeholder="Email (optional)" style="width: 100%; box-sizing: border-box; background: #000; border: 1px solid #444; color: white; padding: 10px; margin-bottom: 20px; font-family: 'JetBrains Mono', monospace;">
              
              <div style="display: flex; gap: 10px;">
                  <button id="profile-cancel" style="flex: 1; background: transparent; color: #888; border: 1px solid #555; padding: 10px; cursor: pointer; border-radius: 4px;">CANCEL</button>
                  <button id="profile-save" style="flex: 1; background: #68BA7F; color: #000; border: none; font-weight: bold; padding: 10px; cursor: pointer; border-radius: 4px;">SAVE</button>
              </div>
          </div>
      </div>
      <canvas id="gameCanvas"></canvas>
    </div>
    <script src="main.js"></script>
  </body>
</html>
