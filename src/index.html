<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Waiting Game</title>
    <!-- Modern Typography: Space Grotesk & JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="styles.css">
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent !important;
        /* Improved font rendering for transparent windows */
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      #game-container {
        width: 100vw;
        height: 100vh;
        background: transparent;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        position: relative;
        /* Kinetic entry disabled if issues persist, but kept for now */
        animation: kinetic-entry 0.6s cubic-bezier(0.23, 1, 0.32, 1);
      }
      @keyframes kinetic-entry {
        from { transform: translateY(100px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      canvas {
        background: transparent !important;
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
        image-rendering: pixelated; /* Crisp dino */
      }
      #ui-layer {
        position: absolute;
        top: 40px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        pointer-events: none;
      }
      .score-board {
        /* backdrop-filter removed as it causes ghosting on Linux/NVIDIA/Wayland */
        background: rgba(8, 18, 18, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 12px 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        color: #68BA7F;
        font-family: 'Space Grotesk', sans-serif;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 2px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .score-value {
        font-family: 'JetBrains Mono', monospace;
        font-size: 28px;
        font-weight: 700;
        text-shadow: 0 0 10px rgba(104, 186, 127, 0.5);
      }
      .high-score {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        opacity: 0.7;
        display: flex;
        justify-content: center;
        gap: 6px;
        color: #A0A0A0;
      }
      .high-score span {
        color: #68BA7F;
      }
      #game-over-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 20;
        opacity: 0;
        pointer-events: none;
        background: transparent;
        transition: opacity 0.5s ease;
      }
      #game-over-layer.terminated {
        background: transparent;
        backdrop-filter: none;
      }
      .go-title {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 42px;
        font-weight: 700;
        color: #ff4b2b;
        letter-spacing: 6px;
        margin-bottom: 12px;
        text-shadow: 0 0 20px rgba(255, 75, 43, 0.4);
      }
      .go-subtitle {
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.7);
        letter-spacing: 2px;
        text-align: center;
        width: 100%;
        max-width: 400px;
      }
      
      /* Modern UI Components */
      .menu-select, .menu-btn, .menu-input {
        background: rgba(255, 255, 255, 0.05);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 10px 15px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        border-radius: 8px;
        outline: none;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .menu-select:hover, .menu-input:focus {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.3);
      }

      .menu-btn {
        background: rgba(104, 186, 127, 0.1);
        color: #68BA7F;
        border-color: rgba(104, 186, 127, 0.3);
        font-weight: 700;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .menu-btn:hover {
        background: rgba(104, 186, 127, 0.2);
        border-color: #68BA7F;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(104, 186, 127, 0.2);
      }

      .menu-btn.primary {
        background: #68BA7F;
        color: #081212;
        border: none;
      }

      .menu-btn.primary:hover {
        background: #7bd094;
        box-shadow: 0 4px 20px rgba(104, 186, 127, 0.4);
      }

      .menu-input {
        width: 100%;
        box-sizing: border-box;
        text-align: center;
        margin-bottom: 8px;
      }

      .profile-section {
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        padding: 20px;
        margin-top: 15px;
        animation: slide-up 0.3s ease-out;
      }

      @keyframes slide-up {
        from { transform: translateY(10px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <div id="ui-layer">
        <div class="score-board">
          <div class="score-value" id="score">00000</div>
          <div class="high-score">HI <span id="highScore">00000</span></div>
        </div>
      </div>
      <div id="game-over-layer">
        <div class="go-title">TERMINATED</div>
        <div class="go-subtitle">
            <!-- Content injected by main.js -->
        </div>
      </div>

      <canvas id="gameCanvas"></canvas>
    </div>
    <script src="main.js"></script>
  </body>
</html>
