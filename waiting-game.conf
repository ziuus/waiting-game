# Waiting Game - Hyprland Integration Module
# Add 'source = ~/.config/hypr/waiting-game.conf' to your hyprland.conf

$waitingBin = __BIN_PATH__

# Keybinds
bind = SUPER SHIFT, G, exec, $waitingBin toggle
bind = SUPER SHIFT, P, exec, $waitingBin pin

# Window rules (Hyprland v0.55+)
# Note: fullscreen is intentionally NOT forced because it can make
# transparent overlays show wallpaper instead of live background apps.
windowrulev2 = float,class:waiting-game-bin
windowrulev2 = noblur,class:waiting-game-bin
windowrulev2 = noshadow,class:waiting-game-bin
windowrulev2 = border_size 0,class:waiting-game-bin
windowrulev2 = rounding 0,class:waiting-game-bin
windowrulev2 = nodim,class:waiting-game-bin
windowrulev2 = noinitialfocus,class:waiting-game-bin

# Autostart
exec-once = $waitingBin run
