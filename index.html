<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waiting Game - Global Ranks</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Waiting Game</h1>
            <p>Global Ranks</p>
        </header>

        <div class="filters">
            <button class="active" data-game="dino">Dino Runner</button>
            <button data-game="flappy">Flappy Bird</button>
            <button data-game="gravity">Gravity Runner</button>
            <button data-game="snake">Cyber Snake</button>
            <button data-game="breakout">Neon Breakout</button>
            <button data-game="defender">Defender</button>
        </div>

        <div class="leaderboard">
            <table>
                <thead>
                    <tr>
                        <th class="rank-col">Rank</th>
                        <th class="name-col">Player</th>
                        <th class="score-col">Score</th>
                        <th class="date-col">Date</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <tr><td colspan="4" style="text-align: center; padding: 2rem;">Loading ranks...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getFirestore, collection, query, where, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        // FIREBASE_CONFIG_PLACEHOLDER
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            projectId: "projects-fff6a",
        };

        let db;
        try {
            if (firebaseConfig.apiKey) {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
            }
        } catch (e) {
            console.error("Firebase init failed", e);
        }

        window.db = db;
        window.collection = collection;
        window.query = query;
        window.where = where;
        window.orderBy = orderBy;
        window.limit = limit;
        window.getDocs = getDocs;
    </script>
    <script src="app.js" type="module"></script>
</body>
</html>
